services:
  postgres:
    image: postgres:16.10-alpine
    environment:
      POSTGRES_USER: grounds
      POSTGRES_PASSWORD: grounds
      POSTGRES_DB: grounds
    ports:
      - '5432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U grounds -d grounds']
      interval: 2s
      timeout: 5s
      retries: 20
